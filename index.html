<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5',
                        secondary: '#10B981'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <nav class="bg-primary text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-book-reader text-2xl"></i>
                    <span class="font-bold text-xl">LMS Portal</span>
                </div>
                <div class="text-sm bg-white/20 px-3 py-1 rounded-full">
                    <i class="fas fa-clock mr-1"></i> Static Demo Mode
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex flex-col md:flex-row gap-8">
        <!-- Sidebar / Add Book -->
        <div class="w-full md:w-1/3 space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                <h2 class="text-xl font-semibold mb-4 text-gray-800 border-b pb-2">Add New Book</h2>
                <form id="addBookForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Book ID</label>
                        <input type="text" id="bookId" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 p-2 border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Title</label>
                        <input type="text" id="bookTitle" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 p-2 border">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Author</label>
                        <input type="text" id="bookAuthor" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring focus:ring-primary focus:ring-opacity-50 p-2 border">
                    </div>
                    <button type="submit" class="w-full bg-primary text-white px-4 py-2 rounded-md hover:bg-indigo-700 transition-colors flex justify-center items-center">
                        <i class="fas fa-plus mr-2"></i> Add Book
                    </button>
                </form>
            </div>

            <!-- Stats -->
            <div class="bg-gradient-to-br from-primary to-purple-600 p-6 rounded-xl shadow-md text-white">
                <h2 class="text-lg font-semibold mb-2">Library Stats</h2>
                <div class="grid grid-cols-2 gap-4 mt-4">
                    <div class="bg-white/20 p-3 rounded-lg text-center">
                        <div class="text-2xl font-bold" id="totalBooks">0</div>
                        <div class="text-sm opacity-80">Total Books</div>
                    </div>
                    <div class="bg-white/20 p-3 rounded-lg text-center">
                        <div class="text-2xl font-bold" id="issuedBooks">0</div>
                        <div class="text-sm opacity-80">Issued</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Main Content / Book List -->
        <div class="w-full md:w-2/3">
            <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-semibold text-gray-800">Book Inventory</h2>
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search ID or Title..." class="pl-8 pr-4 py-1 rounded-full border border-gray-300 text-sm focus:outline-none focus:border-primary">
                        <i class="fas fa-search absolute left-3 top-2 text-gray-400 text-xs"></i>
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-50 text-gray-600 text-sm">
                                <th class="p-3 border-b font-medium">ID</th>
                                <th class="p-3 border-b font-medium">Title</th>
                                <th class="p-3 border-b font-medium">Author</th>
                                <th class="p-3 border-b font-medium">Status</th>
                                <th class="p-3 border-b font-medium text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="bookList" class="text-sm">
                            <!-- Books will be injected here via JS -->
                        </tbody>
                    </table>
                </div>
                
                <!-- Empty State -->
                <div id="emptyState" class="hidden flex-col items-center justify-center py-12 text-gray-400">
                    <i class="fas fa-books text-4xl mb-3"></i>
                    <p>No books found. Add some to get started!</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Issue Book Modal -->
    <div id="issueModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-white p-6 rounded-xl w-96 max-w-[90%] shadow-2xl">
            <h3 class="text-lg font-bold mb-4">Issue Book</h3>
            <input type="hidden" id="issueBookId">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700">Borrower Name</label>
                <input type="text" id="borrowerName" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary p-2 border">
            </div>
            <div class="flex justify-end space-x-2">
                <button onclick="closeModal()" class="px-4 py-2 text-gray-600 bg-gray-100 rounded-md hover:bg-gray-200">Cancel</button>
                <button onclick="confirmIssue()" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-indigo-700">Issue</button>
            </div>
        </div>
    </div>

    <script>
        // Use LocalStorage to simulate the Python Binary File data persistence
        const STORAGE_KEY = 'lms_books_db';
        let books = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        const bookListEl = document.getElementById('bookList');
        const emptyStateEl = document.getElementById('emptyState');
        const form = document.getElementById('addBookForm');
        const searchInput = document.getElementById('searchInput');
        const totalEl = document.getElementById('totalBooks');
        const issuedEl = document.getElementById('issuedBooks');
        const modal = document.getElementById('issueModal');

        function saveBooks() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(books));
            renderBooks();
        }

        function renderBooks(filterText = '') {
            bookListEl.innerHTML = '';
            
            const filteredBooks = books.filter(b => 
                b.book_id.toLowerCase().includes(filterText.toLowerCase()) || 
                b.title.toLowerCase().includes(filterText.toLowerCase())
            );

            if (filteredBooks.length === 0) {
                emptyStateEl.classList.remove('hidden');
                emptyStateEl.classList.add('flex');
            } else {
                emptyStateEl.classList.add('hidden');
                emptyStateEl.classList.remove('flex');
                
                filteredBooks.forEach(book => {
                    const tr = document.createElement('tr');
                    tr.className = "border-b hover:bg-gray-50 transition-colors";
                    
                    const statusBadge = book.status === 'Available' 
                        ? `<span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full"><i class="fas fa-check-circle mr-1"></i>Available</span>`
                        : `<span class="bg-orange-100 text-orange-800 text-xs px-2 py-1 rounded-full" title="Issued to: ${book.issued_to}"><i class="fas fa-clock mr-1"></i>Issued</span>`;
                        
                    const actionBtn = book.status === 'Available'
                        ? `<button onclick="openIssueModal('${book.book_id}')" class="text-primary hover:text-indigo-800 mr-3" title="Issue Book"><i class="fas fa-hand-holding"></i></button>`
                        : `<button onclick="returnBook('${book.book_id}')" class="text-secondary hover:text-green-700 mr-3" title="Return Book"><i class="fas fa-undo"></i></button>`;

                    tr.innerHTML = `
                        <td class="p-3 font-medium text-gray-800">${book.book_id}</td>
                        <td class="p-3 text-gray-600">${book.title}</td>
                        <td class="p-3 text-gray-600">${book.author}</td>
                        <td class="p-3">${statusBadge}</td>
                        <td class="p-3 text-right">
                            ${actionBtn}
                            <button onclick="deleteBook('${book.book_id}')" class="text-red-500 hover:text-red-700" title="Delete"><i class="fas fa-trash"></i></button>
                        </td>
                    `;
                    bookListEl.appendChild(tr);
                });
            }

            // Update stats
            totalEl.innerText = books.length;
            issuedEl.innerText = books.filter(b => b.status === 'Issued').length;
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('bookId').value.trim();
            const title = document.getElementById('bookTitle').value.trim();
            const author = document.getElementById('bookAuthor').value.trim();

            if(books.some(b => b.book_id === id)) {
                alert('Book ID already exists!');
                return;
            }

            books.push({
                book_id: id,
                title: title,
                author: author,
                status: 'Available',
                issued_to: ''
            });

            saveBooks();
            form.reset();
        });

        function deleteBook(id) {
            if(confirm('Are you sure you want to delete this book?')) {
                books = books.filter(b => b.book_id !== id);
                saveBooks();
            }
        }

        function openIssueModal(id) {
            document.getElementById('issueBookId').value = id;
            document.getElementById('borrowerName').value = '';
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
        }

        function confirmIssue() {
            const id = document.getElementById('issueBookId').value;
            const name = document.getElementById('borrowerName').value.trim();
            
            if(!name) {
                alert('Please enter a borrower name');
                return;
            }

            const bookIndex = books.findIndex(b => b.book_id === id);
            if(bookIndex > -1) {
                books[bookIndex].status = 'Issued';
                books[bookIndex].issued_to = name;
                saveBooks();
                closeModal();
            }
        }

        function returnBook(id) {
            if(confirm('Mark this book as returned?')) {
                const bookIndex = books.findIndex(b => b.book_id === id);
                if(bookIndex > -1) {
                    books[bookIndex].status = 'Available';
                    books[bookIndex].issued_to = '';
                    saveBooks();
                }
            }
        }

        searchInput.addEventListener('input', (e) => {
            renderBooks(e.target.value);
        });

        // Initial render
        renderBooks();
    </script>
</body>
</html>
